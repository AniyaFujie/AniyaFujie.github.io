<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>黑客档案</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px 12px;
            color: #fff;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: #0d0d0d;
            border-radius: 24px;
            padding: 18px 16px 0 16px;
            display: flex;
            flex-direction: column;
            min-height: 92vh;
        }

        .site-title-bar {
            text-align: center;
            padding: 6px 0 12px 0;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 14px;
        }
        .site-title-bar .main-title {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 3px;
        }
        .site-title-bar .main-title span {
            color: #4a8af4;
        }
        .site-title-bar .sub-title {
            font-size: 12px;
            color: #555;
            letter-spacing: 4px;
            margin-top: 2px;
        }

        .nav-header {
            background: #141414;
            border-radius: 16px;
            padding: 12px 14px 10px 14px;
            margin-bottom: 16px;
            border: 1px solid #1f1f1f;
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .lang-switcher {
            display: flex;
            gap: 2px;
            background: #1a1a1a;
            padding: 3px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: #666;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            font-family: inherit;
        }
        .lang-btn:hover {
            color: #aaa;
        }
        .lang-btn.active {
            background: #2a2a3a;
            color: #8ab4f8;
            box-shadow: 0 0 12px rgba(74, 138, 244, 0.08);
        }

        .page-tabs {
            display: flex;
            gap: 4px;
        }
        .page-tab {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            font-size: 12px;
            color: #777;
            cursor: pointer;
            transition: 0.25s;
            font-family: inherit;
            flex: 1;
            text-align: center;
        }
        .page-tab:hover {
            border-color: #4a6a8a;
            color: #aaa;
        }
        .page-tab.active {
            background: #1a1a2a;
            border-color: #4a8af4;
            color: #8ab4f8;
            box-shadow: 0 0 20px rgba(74, 138, 244, 0.06);
        }

        .page-panel {
            display: none;
            animation: fade 0.3s ease;
        }
        .page-panel.active {
            display: block;
        }
        @keyframes fade {
            0% {
                opacity: 0.3;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sub-info {
            font-size: 13px;
            color: #666;
            margin-bottom: 14px;
            padding-left: 4px;
        }

        .exposure-card {
            background: #141414;
            border-radius: 12px;
            padding: 4px 0;
            border: 1px solid #1a1a1a;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            gap: 12px;
            border-bottom: 1px solid #0d0d0d;
            transition: 0.15s;
            cursor: pointer;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item:hover {
            background: #1a1a1a;
            border-radius: 8px;
        }

        .item-index {
            font-size: 15px;
            font-weight: 700;
            color: #f5c542;
            min-width: 32px;
        }

        .item-body {
            flex: 1;
            min-width: 0;
        }
        .item-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
        }
        .item-desc {
            font-size: 12px;
            color: #777;
            margin-top: 1px;
            line-height: 1.4;
        }

        .item-tag {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
        }

        .solution-divider {
            height: 1px;
            background: #1a1a1a;
            margin-bottom: 18px;
        }

        .accordion {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .accordion-item {
            background: #141414;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            overflow: hidden;
            transition: 0.3s;
        }
        .accordion-item:hover {
            border-color: #2a2a2a;
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
        }
        .accordion-header:hover {
            background: #1a1a1a;
        }
        .accordion-header .title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .accordion-header .arrow {
            font-size: 14px;
            color: #555;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .accordion-item.open .accordion-header .arrow {
            transform: rotate(180deg);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0 16px;
        }
        .accordion-item.open .accordion-body {
            max-height: 3000px;
            padding: 0 16px 18px 16px;
        }

        .timeline {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
        }

        .timeline-item {
            position: relative;
            padding: 10px 0 10px 32px;
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 16px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a2a3a;
            border: 2px solid #3a3a4a;
            z-index: 2;
            transition: 0.3s;
        }
        .timeline-item.active::before {
            background: #4a8af4;
            border-color: #4a8af4;
            box-shadow: 0 0 16px rgba(74, 138, 244, 0.3);
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            left: 10px;
            top: 26px;
            bottom: -6px;
            width: 2px;
            background: #1a1a2a;
            z-index: 1;
        }
        .timeline-item:last-child::after {
            display: none;
        }

        .timeline-branch {
            padding-left: 32px;
            margin: 4px 0 6px 0;
            border-left: 2px dashed #1a1a2a;
        }
        .timeline-branch .timeline-item {
            padding-left: 24px;
        }
        .timeline-branch .timeline-item::before {
            left: 0px;
            width: 8px;
            height: 8px;
            top: 16px;
            background: #1a1a2a;
            border-color: #2a2a3a;
        }
        .timeline-branch .timeline-item::after {
            left: 4px;
        }

        .hl-gold {
            color: #f5c542;
        }
        .hl-blue {
            color: #4a8af4;
            font-weight: 500;
        }

        .podium-title {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .podium-title span {
            color: #f5c542;
            text-shadow: 0 0 30px rgba(245, 197, 66, 0.15);
        }

        .podium-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 8px;
            margin-bottom: 28px;
            padding: 0 4px;
        }

        .podium-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 110px;
            transition: 0.3s;
        }

        .podium-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2a, #0d0d1a);
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 4px;
            transition: 0.3s;
        }
        .podium-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .podium-avatar .fallback {
            font-size: 24px;
            font-weight: 700;
            color: #8ab4f8;
        }

        .podium-item.first .podium-avatar {
            width: 84px;
            height: 84px;
            border-color: #f5c542;
            box-shadow: 0 0 40px rgba(245, 197, 66, 0.2), inset 0 0 30px rgba(245, 197, 66, 0.05);
        }
        .podium-item.first .podium-badge {
            color: #f5c542;
            font-size: 18px;
            text-shadow: 0 0 20px rgba(245, 197, 66, 0.2);
        }
        .podium-item.first .podium-name {
            font-size: 17px;
        }

        .podium-item.second .podium-avatar {
            width: 60px;
            height: 60px;
            border-color: #8899aa;
            box-shadow: 0 0 30px rgba(136, 153, 170, 0.12);
        }
        .podium-item.second .podium-badge {
            color: #8899aa;
        }

        .podium-item.third .podium-avatar {
            width: 60px;
            height: 60px;
            border-color: #cd7f32;
            box-shadow: 0 0 30px rgba(205, 127, 50, 0.12);
        }
        .podium-item.third .podium-badge {
            color: #cd7f32;
        }

        .podium-badge {
            font-size: 14px;
            font-weight: 800;
            color: #666;
            margin-bottom: 2px;
        }

        .podium-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
            text-align: center;
        }

        .podium-heat {
            font-size: 12px;
            color: #777;
            margin-top: 2px;
        }
        .podium-heat span {
            color: #f5c542;
            font-weight: 700;
        }

        .podium-base {
            width: 100%;
            height: 6px;
            border-radius: 6px;
            margin-top: 8px;
            background: #2a2a2a;
            transition: 0.3s;
            overflow: hidden;
        }
        .podium-item.first .podium-base {
            background: linear-gradient(90deg, #f5c542, #f59e0b);
            height: 8px;
            box-shadow: 0 0 24px rgba(245, 197, 66, 0.15);
        }
        .podium-item.second .podium-base {
            background: linear-gradient(90deg, #8899aa, #6b7a8a);
        }
        .podium-item.third .podium-base {
            background: linear-gradient(90deg, #cd7f32, #a8622a);
        }

        .rank-list-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .rank-list-header .bar {
            width: 4px;
            height: 18px;
            background: #4a8af4;
            border-radius: 4px;
        }
        .rank-list-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .rank-card {
            background: #141414;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            padding: 2px 0;
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid #0d0d0d;
            transition: 0.15s;
        }
        .rank-item:last-child {
            border-bottom: none;
        }
        .rank-item:hover {
            background: #1a1a1a;
            border-radius: 8px;
        }

        .rank-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1.5px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #888;
            flex-shrink: 0;
            background: #0d0d0d;
        }

        .rank-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2a, #0d0d1a);
            border: 1.5px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .rank-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .rank-avatar .fallback {
            font-size: 14px;
            font-weight: 700;
            color: #8ab4f8;
        }

        .rank-info {
            flex: 1;
            min-width: 0;
        }
        .rank-info .rank-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
        }
        .rank-info .rank-heat {
            font-size: 12px;
            color: #777;
            margin-top: 1px;
        }
        .rank-info .rank-heat .value {
            color: #a855f7;
            font-weight: 600;
        }

        .rank-arrow {
            color: #444;
            font-size: 16px;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .rank-item:hover .rank-arrow {
            color: #777;
        }

        /* ================================================================
           页脚
           ================================================================ */
        .site-footer {
            margin-top: auto;
            padding: 20px 8px 16px 8px;
            border-top: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        .footer-copyright {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .footer-licenses {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            color: #cccccc;
        }

        .license-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer-action {
            font-size: 14px;
            color: #ffffff;
            margin: 2px 0;
        }
        .footer-action .complaint-link {
            color: #e74c3c;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
            cursor: pointer;
        }
        .footer-action .complaint-link:hover {
            color: #ff6b5a;
            text-decoration: underline;
        }

        .footer-disclaimer {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 11px;
            color: #666666;
            line-height: 1.6;
            letter-spacing: 0.2px;
        }

        @media (max-width: 400px) {
            .app {
                padding: 12px 10px 0 10px;
            }

                { from: /отклонено|вердикту/g, to: '<span class="hl-gold">$&</span>' },
            ];
            let result = text;
            replacements.forEach(({ from, to }) => {

            });

            while (top3.length < 3) {

            }
            const order = [top3[1], top3[0], top3[2]];
            const labels = ['2', '1', '3'];
            const classes = ['second', 'first', 'third'];
            const colors = ['#8899aa', '#f5c542', '#cd7f32'];
